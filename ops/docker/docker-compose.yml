name: sinpapel-boilerplate

services:
  db:
    # PostGIS sobre PostgreSQL 16: la extensión queda disponible para cuando
    # un modelo necesite geometría. El backend usa el engine `postgresql`
    # normal mientras no la use (ver config/settings/base.py).
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sinpapel}
      POSTGRES_USER: ${POSTGRES_USER:-sinpapel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinpapel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sinpapel} -d ${POSTGRES_DB:-sinpapel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../..
      dockerfile: ops/docker/backend.Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-sinpapel}:${POSTGRES_PASSWORD:-sinpapel}@db:5432/${POSTGRES_DB:-sinpapel}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-inseguro-cambiar-en-produccion}
      DJANGO_DEBUG: "true"
    volumes:
      - ../../backend:/app
      # `spec/` es la verdad de los flujos. En desarrollo se monta con
      # escritura para que el designer pueda guardar; en producción va
      # read-only (`:ro`) y el guardado además queda deshabilitado por DEBUG.
      - ../../spec:/spec
      # Bundle del designer, construido con `make designer`. Read-only: es un
      # artefacto de build, el contenedor no debe tocarlo.
      - ../../designer:/designer:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Sin healthcheck, `docker compose up --wait` da el servicio por listo en
      # cuanto el proceso arranca, no cuando responde. urllib en vez de curl:
      # la imagen slim no lo trae.
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/salud/')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ../..
      dockerfile: ops/docker/frontend.Dockerfile
    environment:
      # Nombre del servicio, no localhost: dentro del contenedor del frontend
      # `localhost` es el propio contenedor y ahí no escucha el backend.
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1 y no localhost: dentro del contenedor localhost resuelve a
      # ::1 y Vite solo escucha en IPv4, así que el check daría connection
      # refused con el servidor arriba.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db_data:
  frontend_node_modules:
