[project]
name = "sinpapel-boilerplate-backend"
version = "0.2.0"
description = "Backend del template de sistemas de trámites sobre sinpapel."
requires-python = ">=3.12,<3.13"

# Pines del ecosistema sinpapel. NO hacer bump sin actualizar spec/decisiones/
# y volver a correr `make verify`. El gate `audit` verifica que sigan intactos.
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.15,<4.0",
    "sinpapel~=0.8.4",
    "sinpapel-drf~=0.4.6",
    "sinpapel-webhooks~=0.2.4",
    "sinpapel-reports~=0.2.4",
    "psycopg[binary]>=3.2,<4.0",
    "django-environ>=0.11,<0.13",
    "gunicorn>=23.0,<27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    # Entrypoints de servidor: los ejecuta gunicorn, no la suite. Medirlos solo
    # produce un 0% permanente que hay que aprender a ignorar, y un umbral que
    # se ignora deja de ser un umbral.
    "*/wsgi.py",
    "*/asgi.py",
    # Los settings sí se ejercitan, pero fuera de este proceso: `test.py` es el
    # que corre la suite, y `prod.py` lo carga el gate `deploy` con
    # `check --deploy`. Contarlos aquí mediría el proceso equivocado.
    "*/settings/*",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
