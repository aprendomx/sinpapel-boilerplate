name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      db:
        # Misma imagen que ops/docker/docker-compose.yml.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: sinpapel
          POSTGRES_USER: sinpapel
          POSTGRES_PASSWORD: sinpapel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinpapel -d sinpapel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://sinpapel:sinpapel@localhost:5432/sinpapel
      DJANGO_SECRET_KEY: ci-no-usar-en-produccion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Pineada a propósito: sin esto el CI instala la última uv, y el
          # resolutor puede cambiar bajo los pies — justo la no-determinación
          # que el lockfile existe para evitar. Subirla es una decisión, no un
          # efecto secundario; al hacerlo hay que correr `make lock`.
          version: "0.10.10"

      - name: Instalar dependencias
        run: make install

      - name: Gates
        # `make verify` corre lint, migrations, test y audit. La base de datos
        # la provee el service container de arriba, así que no hace falta
        # levantar compose.
        run: make verify

      - name: Gate rename
        # Aparte de `make verify`: monta un entorno completo desde cero.
        run: make rename-check

      - name: Instalar Chromium para el e2e
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: Gate e2e
        # Necesita el stack real: es la única prueba que ejercita a la vez el
        # frontend, el proxy, la sesión, el CSRF y el motor.
        #
        # El .env no está versionado y `make up` lo crea desde .env.example, así
        # que este paso recorre exactamente el camino de un clon limpio. No se
        # añade aquí un `cp` a mano: dejaría verde en CI un arranque que a una
        # persona le seguiría fallando.
        env:
          # El compose publica la base en el puerto del host y el 5432 ya lo
          # ocupa el service container de arriba. El backend habla con `db:5432`
          # por la red de compose, así que solo cambia la publicación.
          POSTGRES_PORT: "5433"
        run: |
          make up
          make seed
          make e2e

      - name: Artefactos del e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Gate deploy-smoke
        # El compose de producción estaba documentado y nunca se levantaba. Va
        # después del e2e porque tarda minutos y usa el mismo docker.
        run: make deploy-smoke

      - name: Verificar que lo vendorizado está sincronizado
        # .claude/skills/ y .claude/commands/ nunca se editan a mano: si el sync
        # produce un diff, alguien los tocó o el repo canónico avanzó sin
        # actualizar aquí.
        run: |
          make skills-sync
          git diff --exit-code -- .claude/skills .claude/commands .claude/SKILLS_VERSION
